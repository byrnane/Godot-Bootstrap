name: Smoke Checks

on:
  pull_request:
  push:
    branches: [main, 3d, 2d, 2d-pixelart]

env:
  GODOT_VERSION: 4.7.2
  GAME_TEMPLATE_VARIANT: ${{ github.base_ref || github.ref_name }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install pinned editor addons
        shell: pwsh
        run: ./scripts/install_addons.ps1
      - name: Install matching Godot
        run: |
          curl -fL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          echo "GODOT_BIN=$(find /tmp/godot -maxdepth 1 -type f -name 'Godot*' -print -quit)" >> "$GITHUB_ENV"
      - name: Import resources
        run: '"$GODOT_BIN" --headless --editor --path . --import'
        timeout-minutes: 3
      - name: Run isolated smoke
        shell: pwsh
        run: ./scripts/run_smoke.ps1 -GodotExecutable $env:GODOT_BIN -Headless
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-result
          path: .local/smoke/
          include-hidden-files: true

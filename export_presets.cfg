[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="LICENSE,THIRD_PARTY.md,shared/ui/theme/fonts/*-OFL.txt"
exclude_filter="addons/*,art_source/*,authoring/*,builds/*,core/debug/*,docs/*,scripts/*"
export_path="builds/windows/GameTemplate.exe"
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc2=false
application/modify_resources=true
application/icon="res://icon.svg"
application/product_name="Game Template"
application/file_description="Godot 2D/3D jam starter"
codesign/enable=false

[preset.1]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="LICENSE,THIRD_PARTY.md,shared/ui/theme/fonts/*-OFL.txt"
exclude_filter="addons/*,art_source/*,authoring/*,builds/*,core/debug/*,docs/*,scripts/*"
export_path="builds/web/index.html"
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
